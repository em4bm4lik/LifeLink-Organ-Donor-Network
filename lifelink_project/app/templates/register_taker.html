{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Taker Registration</h2>
  <form method="POST">
    <div class="mb-3"><input class="form-control" name="first_name" placeholder="First Name" required></div>
    <div class="mb-3"><input class="form-control" name="last_name" placeholder="Last Name" required></div>
    <div class="mb-3"><input class="form-control" name="address" placeholder="Address" required></div>
    <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
    <div class="mb-3"><input class="form-control" name="phone_no" placeholder="Phone Number" required></div>
    <div class="mb-3"><input class="form-control" name="date_of_birth" type="date" placeholder="Date of Birth" required></div>
    <div class="mb-3"><input class="form-control" name="blood_type" placeholder="Blood Type" required></div>
    <div class="mb-3"><input class="form-control" name="health_condition" placeholder="Health Condition" required></div>
    <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
    <button class="btn btn-primary" type="submit">Register</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{{ url_for('auth.login_taker') }}">Login here</a>.</p>
</div>
{% endblock %}
