{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Organs</h2>
  <a href="{{ url_for('organ.add_organ') }}" class="btn btn-success mb-3">Add Organ</a>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Type</th><th>Condition</th><th>Expiry</th><th>Hospital</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for organ in organs %}
      <tr>
        <td>{{ organ.type }}</td>
        <td>{{ organ.condition }}</td>
        <td>{{ organ.expiry }}</td>
        <td>{{ organ.hospital.name if organ.hospital else '' }}</td>
        <td>
          <a href="{{ url_for('organ.edit_organ', organ_id=organ.organ_id) }}" class="btn btn-primary btn-sm">Edit</a>
          <a href="{{ url_for('organ.delete_organ', organ_id=organ.organ_id) }}" class="btn btn-danger btn-sm" onclick="return confirm('Delete this organ?');">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
